{% extends "base.html" %}
{% from "_macros.html" import task_table %}
{% block content %}
<p class="muted"><a href="{{ url_for('overview') }}">Countries</a> / <a href="{{ url_for('country', code=a.country) }}">{{ countries.get(a.country, a.country) }}</a></p>
<h1>{{ a.name }}</h1>

<h2>Tasks</h2>
{{ task_table(tasks) }}

<h2>Our brief</h2>
<form method="post" class="card">
  <input type="hidden" name="action" value="brief">
  <textarea name="our_brief">{{ a.our_brief }}</textarea>
  <label>Status</label>
  <select name="status" style="width:auto">{% for s in ['active', 'planned', 'paused'] %}<option {% if a.status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select>
  <p><button class="secondary">Save brief</button></p>
</form>

<h2>Add a task</h2>
<form method="post" class="card">
  <input type="hidden" name="action" value="add_task">
  {% if candidates %}
  <label>Existing organisation in {{ countries.get(a.country, a.country) }}</label>
  <select name="org_id"><option value="">(new organisation, fill in below)</option>{% for o in candidates %}<option value="{{ o.id }}">{{ o.name }}</option>{% endfor %}</select>
  {% endif %}
  <div class="grid">
    <div><label>New organisation name</label><input name="name"></div>
    <div><label>Type</label><select name="kind"><option value="media">Media</option><option value="community">Community body</option><option value="employer">Employer (HR)</option></select></div>
    <div><label>City</label><input name="city"></div>
    <div><label>Official email</label><input name="contact_email" type="email"></div>
    <div><label>Phone or WhatsApp</label><input name="contact_phone"></div>
    <div><label>Website contact form</label><input name="contact_form_url"></div>
    <div><label>Social media page</label><input name="social_url"></div>
    <div><label>Website</label><input name="website"></div>
    <div><label>Source URL (where the details came from)</label><input name="source_url"></div>
  </div>
  <label>Their brief (who they are, reach, how to reach them)</label><input name="source_note">
  <p><button>Add task</button></p>
</form>
{% endblock %}
