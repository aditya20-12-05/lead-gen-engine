{% macro status_pill(status) -%}
<span class="pill {{ 'ready' if status == 'ready' else 'waiting' if status == 'reply waiting' else 'blocked' if status in ('needs email', 'do not contact') else '' }}">{{ status }}</span>
{%- endmacro %}

{% macro task_table(tasks) -%}
<table>
  <tr><th>Organisation</th><th>Email</th><th>Status</th><th>Owner</th></tr>
  {% for t in tasks %}
  <tr>
    <td><a href="{{ url_for('task', task_id=t.task_id) }}">{{ t.org.name }}</a></td>
    <td>{{ t.org.contact_email or '' }}</td>
    <td>{{ status_pill(t.status) }}</td>
    <td class="muted">{{ t.owner or '' }}</td>
  </tr>
  {% else %}<tr><td colspan="4" class="muted">No tasks yet.</td></tr>{% endfor %}
</table>
{%- endmacro %}
