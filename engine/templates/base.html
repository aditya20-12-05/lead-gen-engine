<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SELEQT Outreach{% endblock %}</title>
<style>
  :root { --ink: #1d2433; --muted: #5b6475; --line: #dde1e8; --bg: #f7f8fa; --accent: #1f4e79; --bad: #a12a2a; --good: #23683b; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: var(--accent); color: #fff; padding: 12px 24px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  header a { color: #fff; text-decoration: none; opacity: .85; }
  header a:hover { opacity: 1; }
  header strong { letter-spacing: .08em; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 17px; margin: 28px 0 8px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #eef1f5; font-weight: 600; font-size: 13px; }
  .card { background: #fff; border: 1px solid var(--line); padding: 16px; margin: 12px 0; border-radius: 6px; }
  .muted { color: var(--muted); font-size: 13px; }
  .flash { padding: 10px 14px; margin: 8px 0; border-radius: 4px; }
  .flash.error { background: #fbeaea; color: var(--bad); }
  .flash.ok { background: #e8f4ec; color: var(--good); }
  .bad { color: var(--bad); } .good { color: var(--good); }
  input, select, textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; width: 100%; }
  textarea { min-height: 320px; }
  label { display: block; margin: 8px 0 2px; font-size: 13px; color: var(--muted); }
  button { font: inherit; padding: 7px 14px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: #6b7385; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: #eef1f5; }
  .pill.ready { background: #e8f4ec; color: var(--good); } .pill.waiting { background: #fff3d6; color: #8a5a00; } .pill.blocked { background: #fbeaea; color: var(--bad); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } @media (max-width: 800px) { .two { grid-template-columns: 1fr; } }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .inline { display: inline; }
  pre { white-space: pre-wrap; background: #fafbfc; border: 1px solid var(--line); padding: 12px; }
</style>
</head>
<body>
<header>
  <strong>SELEQT OUTREACH</strong>
  <a href="{{ url_for('overview') }}">Countries</a>
  <a href="{{ url_for('organisations') }}">Organisations</a>
  <a href="{{ url_for('events') }}">Webinars</a>
  <a href="{{ url_for('enquiries') }}">Enquiries</a>
  <a href="{{ url_for('dnc') }}">Do not contact</a>
  <span style="margin-left:auto" class="muted">{% if mail_user %}<span style="color:#cfe8d6">Mailbox: {{ mail_user }}</span>{% else %}<span style="color:#f3d0d0">Mailbox not connected</span>{% endif %}</span>
</header>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
